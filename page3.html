<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Now!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 <style>
        body {
            background-image: url("https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/8048edd1-98cc-42df-b46b-905a84cd33dc/CASA+PROGRAM+5+-+18+copy.jpg?format=2500w");
            background-size: cover;
            background-position: center;
        }

        .navbar img {
            height: 55px;
        }

        .table-box {
            background: rgba(250, 249, 249, 0.925);
            padding: 25px;
            border-radius: 10px;
            max-width: 900px;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background: rgb(22, 121, 104);
            color: white;
        }

        footer {
            background: rgb(22, 121, 104);
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-sm navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/7c5f2399-faf0-4b55-abef-0d5a936d20c5/OBMC+-+60TH+LOGO+-+DIAMOND+SLOGAN+-+APPROVED+-+2026+FA_OBMC+-+COLOR+HORIZONTAL.png?format=1500w" alt="OBMC Logo">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                <li class="nav-item"><a class="nav-link" href="#contact">Contact Us</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Enrollment</a></li>
            </ul>
        </div>

        <button class="btn btn-success">My Portal</button>
    </div>
</nav>

<div class="container my-4">
    <div class="table-box">

        <h2 class="text-center mb-4">Enroll Now!</h2>

        <form>
            <table>
                <tr>
                    <th colspan="2">Student Information</th>
                </tr>

                <tr>
                    <td>First Name</td>
                    <td><input type="text" class="form-control" placeholder="John" required></td>
                </tr>

                <tr>
                    <td>Last Name</td>
                    <td><input type="text" class="form-control" placeholder="Doe" required></td>
                </tr>

                <tr>
                    <td>Birth Date</td>
                    <td><input type="date" class="form-control" required></td>
                </tr>

                <tr>
                    <td>Gender</td>
                    <td>
                        <select class="form-select" required>
                            <option value="">Select...</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Grade Level</td>
                    <td>
                        <select class="form-select" required>
                            <option value="">Select Grade Level...</option>
                            <option>Grade 7</option>
                            <option>Grade 8</option>
                            <option>Grade 9</option>
                            <option>Grade 10</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <th colspan="2">Contact Details</th>
                </tr>

                <tr>
                    <td>Email Address</td>
                    <td><input type="email" class="form-control" placeholder="student@example.com" required></td>
                </tr>

                <tr>
                    <td>Contact Number</td>
                    <td><input type="tel" class="form-control" placeholder="0912-345-6789" required></td>
                </tr>
            </table>

            <div class="text-center mt-4">
                <input type="submit" value="Submit Enrollment" class="btn btn-success">
            </div>
        </form>

    </div>
</div>

<footer id="contact">
    <p>2026 OBMC | All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
